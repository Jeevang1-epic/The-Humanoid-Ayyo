[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "ayyo-visual-evaluation"
version = "0.1.0"
description = "Deterministic bounded visual producer evaluation for Ayyo"
requires-python = ">=3.12"
license = {text = "Proprietary"}
maintainers = [
  {name = "P. Jeevan Kumar", email = "jeevan116p@gmail.com"},
]
dependencies = [
  "ayyo-world-model==0.1.0",
]

[tool.setuptools.packages.find]
where = ["src"]
