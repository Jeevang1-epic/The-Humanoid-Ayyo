[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "ayyo-manipulation-simulation-execution"
version = "0.1.0"
description = "Simulation-only Stage 9C trajectory execution evidence boundary for Ayyo"
requires-python = ">=3.12"
license = {text = "Proprietary"}
maintainers = [
  {name = "P. Jeevan Kumar", email = "jeevan116p@gmail.com"},
]
dependencies = [
  "ayyo-manipulation-planning==0.1.0",
  "ayyo-manipulation-trajectory==0.1.0",
]

[tool.setuptools.packages.find]
where = ["src"]
