[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "ayyo-promotion-control"
version = "0.1.0"
description = "Pure candidate-policy promotion and rollback evidence controls for Ayyo"
requires-python = ">=3.12"
license = {text = "Proprietary"}
maintainers = [
  {name = "P. Jeevan Kumar", email = "jeevan116p@gmail.com"},
]
dependencies = [
  "ayyo-learning-evaluation==0.1.0",
]

[tool.setuptools.packages.find]
where = ["src"]
