[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "ayyo-developmental-scenarios"
version = "0.1.0"
description = "Deterministic development-only simulation scenario contracts for Ayyo"
requires-python = ">=3.12"
license = {text = "Proprietary"}
maintainers = [
  {name = "P. Jeevan Kumar", email = "jeevan116p@gmail.com"},
]
dependencies = [
  "ayyo-executive==0.1.0",
  "ayyo-memory==0.1.0",
  "ayyo-personal-context==0.1.0",
  "ayyo-runtime-bridge==0.1.0",
  "ayyo-safety==0.1.0",
  "ayyo-skill-manager==0.1.0",
]

[project.scripts]
ayyo-scenarios = "ayyo_developmental_scenarios.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
