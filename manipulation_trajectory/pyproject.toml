[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "ayyo-manipulation-trajectory"
version = "0.1.0"
description = "Deterministic pre-execution trajectory eligibility boundary for Ayyo"
requires-python = ">=3.12"
license = {text = "Proprietary"}
maintainers = [
  {name = "P. Jeevan Kumar", email = "jeevan116p@gmail.com"},
]
dependencies = [
  "ayyo-executive==0.1.0",
  "ayyo-manipulation-planning==0.1.0",
  "ayyo-safety==0.1.0",
  "ayyo-skill-manager==0.1.0",
]

[tool.setuptools.packages.find]
where = ["src"]
