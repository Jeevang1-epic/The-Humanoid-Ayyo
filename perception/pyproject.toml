[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "ayyo-perception"
version = "0.1.0"
description = "Deterministic transport-neutral perception trust boundary for Ayyo"
requires-python = ">=3.12"
license = {text = "Proprietary"}
maintainers = [
  {name = "P. Jeevan Kumar", email = "jeevan116p@gmail.com"},
]
dependencies = [
  "ayyo-depth-camera==0.1.0",
  "ayyo-physical-camera==0.1.0",
  "ayyo-rgbd-fusion==0.1.0",
  "ayyo-world-model==0.1.0",
  "ayyo-visual-evaluation==0.1.0",
]

[tool.setuptools.packages.find]
where = ["src"]
