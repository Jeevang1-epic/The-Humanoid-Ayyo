[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "ayyo-learning-evaluation"
version = "0.1.0"
description = "Bounded inert candidate-policy and offline evaluation contracts for Ayyo"
requires-python = ">=3.12"
license = {text = "Proprietary"}
maintainers = [
  {name = "P. Jeevan Kumar", email = "jeevan116p@gmail.com"},
]
dependencies = [
  "ayyo-teach-mode==0.1.0",
]

[tool.setuptools.packages.find]
where = ["src"]
